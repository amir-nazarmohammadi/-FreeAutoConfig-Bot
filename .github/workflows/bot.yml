name: FreeAutoConfig Bot

on:
  workflow_dispatch:
  schedule:
   - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run VPN config bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: '@FreeAutoConfig'
        run: python bot.py

      - name: Run proxy bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: '@FreeAutoConfig'
        run: python proxy_bot.py
